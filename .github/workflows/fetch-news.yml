name: Fetch news (아침/점심/저녁)

on:
  schedule:
    # KST 기준 07:00 / 12:00 / 18:00 실행 (KST = UTC+9 이므로 UTC로는 22:00 전날 / 03:00 / 09:00)
    - cron: "0 22 * * *"
    - cron: "0 3 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 구글 뉴스 RSS 호출 → data/news.json 생성
        run: node scripts/fetch-news.js

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "변경된 뉴스가 없어 커밋을 건너뜁니다."
          else
            git commit -m "chore: 뉴스 데이터 자동 갱신 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
